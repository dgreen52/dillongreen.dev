<!doctype html>
<!-- Per-page share card (1200x630). tools/render_og.js loads this file once per page and calls
     window.fill({ kicker, title, sub, art, accent }) before the screenshot. Big type on purpose:
     link previews are often shown at ~500px wide or less. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("../../site/assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "JetBrains Mono"; src: url("../../site/assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #06080b; --ink: #e8f6fa; --ink-2: #b3c6ce; --ink-3: #8aa3ad; --cyan: #2de2ff; --pink: #ff3dc8; --live: #3dff9a; --amber: #ffb547; --line: #1a2f39; --line-2: #27505b; --a: var(--cyan); --b: var(--pink); }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink); font-family: "Archivo"; position: relative;
  background-image:
    radial-gradient(900px 520px at 88% 8%, rgba(45, 226, 255, 0.10), transparent 70%),
    radial-gradient(700px 420px at 0% 100%, rgba(255, 61, 200, 0.08), transparent 70%),
    linear-gradient(rgba(45, 226, 255, 0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 226, 255, 0.055) 1px, transparent 1px);
  background-size: auto, auto, 48px 48px, 48px 48px;
}
.frame { position: absolute; inset: 28px; border: 1px solid rgba(45, 226, 255, 0.28); }
.frame::before, .frame::after { content: ""; position: absolute; width: 34px; height: 34px; border: 0 solid var(--a); }
.frame::before { left: -2px; top: -2px; border-top-width: 4px; border-left-width: 4px; }
.frame::after { right: -2px; bottom: -2px; border-bottom-width: 4px; border-right-width: 4px; border-color: var(--b); }
.pad { position: absolute; inset: 62px 72px 58px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; font: 600 23px/1.2 "JetBrains Mono"; letter-spacing: .12em; text-transform: uppercase; color: var(--a); white-space: nowrap; }
.top .k { display: flex; align-items: center; gap: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top .k::before { content: "//"; color: var(--b); }
.lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 5px rgba(61, 255, 154, .18), 0 0 14px var(--live); flex: none; }
.mark { display: grid; place-items: center; width: 56px; height: 56px; border: 2px solid var(--cyan); color: var(--cyan); font: 700 22px "JetBrains Mono"; box-shadow: 0 0 18px rgba(45, 226, 255, .45), inset 0 0 12px rgba(45, 226, 255, .18); flex: none; }
h1 { margin-top: 40px; font-weight: 800; font-stretch: 118%; letter-spacing: -0.03em; line-height: .98; text-shadow: 0 0 40px rgba(45, 226, 255, .22); }
h1 .dot { color: var(--b); text-shadow: 0 0 22px var(--b); }
.sub { margin-top: 24px; font-size: 32px; line-height: 1.3; font-weight: 500; color: var(--ink-2); letter-spacing: -0.005em; max-width: 960px; }
.sub b { color: var(--ink); font-weight: 650; }
.foot { margin-top: auto; padding-top: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.art { flex: 1; min-width: 0; }
.site { font: 600 24px "JetBrains Mono"; letter-spacing: .06em; color: var(--ink); white-space: nowrap; }
.site span { color: var(--a); }
/* art: a strip of HUD chips */
.chips { display: flex; flex-wrap: wrap; gap: 12px; }
.chips i { font: 600 21px/1 "JetBrains Mono"; font-style: normal; letter-spacing: .06em; text-transform: uppercase; padding: 11px 14px; border: 1.5px solid var(--line-2); color: var(--ink-2); }
.chips i.on { border-color: rgba(61, 255, 154, .55); color: var(--live); }
.chips i.c { border-color: rgba(45, 226, 255, .55); color: var(--cyan); }
.chips i.p { border-color: rgba(255, 61, 200, .55); color: var(--pink); }
.chips i.a { border-color: rgba(255, 181, 71, .55); color: var(--amber); }
/* art: an ARINC 429 word */
.bits { display: grid; grid-template-columns: repeat(32, 1fr); gap: 4px; max-width: 820px; }
.bits i { font: 600 21px/1 "JetBrains Mono"; font-style: normal; text-align: center; padding: 9px 0 8px; background: #111a22; border-top: 3px solid var(--f); color: var(--ink); }
.bits i.z { color: #6b7f88; font-weight: 400; }
.wordrow { display: flex; align-items: flex-end; gap: 22px; }
.wordrow .bits { flex: 1; }
.ro { font: 600 15px/1.35 "JetBrains Mono"; color: var(--ink-3); letter-spacing: .08em; text-align: right; white-space: nowrap; }
.ro b { display: block; font-size: 34px; color: var(--cyan); letter-spacing: 0; }
.foot:has(.wordrow) { flex-direction: column; align-items: stretch; gap: 18px; }
.foot:has(.wordrow) .site { align-self: flex-end; }
/* art: big numbers */
.stats { display: flex; gap: 40px; }
.stats div { display: grid; gap: 2px; }
.stats b { font: 700 46px/1 "JetBrains Mono"; color: var(--cyan); }
.stats b.g { color: var(--live); }
.stats small { font: 600 17px "JetBrains Mono"; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
</style></head>
<body>
<div class="frame"></div>
<div class="pad">
  <div class="top"><span class="k"><span class="lamp"></span><span id="kicker"></span></span><span class="mark">DG</span></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="foot"><div class="art" id="art"></div><div class="site">dillongreen<span>.dev</span></div></div>
</div>
<script>
  // Builds the card from data. Text goes in with textContent; the only markup is the art below.
  window.fill = function (d) {
    document.getElementById("kicker").textContent = d.kicker;
    var h = document.getElementById("title");
    h.textContent = d.title;
    if (d.dot) { var s = document.createElement("span"); s.className = "dot"; s.textContent = d.dot; h.appendChild(s); }
    var sub = document.getElementById("sub");
    sub.textContent = d.sub || "";
    if (d.subStrong) { var b = document.createElement("b"); b.textContent = d.subStrong; sub.insertBefore(document.createTextNode(" "), sub.firstChild); sub.insertBefore(b, sub.firstChild); }
    var art = document.getElementById("art"), a = d.art || {};
    if (a.chips) {
      var c = document.createElement("div"); c.className = "chips";
      a.chips.forEach(function (x) { var i = document.createElement("i"); i.textContent = x[0]; if (x[1]) i.className = x[1]; c.appendChild(i); });
      art.appendChild(c);
    }
    if (a.bits) {
      var g = document.createElement("div"); g.className = "bits";
      for (var k = 0; k < 32; k++) {
        var n = 32 - k, f = n === 32 ? "#8aa3ad" : n >= 30 ? "#ffb547" : n >= 11 ? "#2de2ff" : n >= 9 ? "#9b87f5" : "#3dff9a";
        var i = document.createElement("i"); i.textContent = a.bits[k]; i.style.setProperty("--f", f); if (a.bits[k] === "0") i.className = "z"; g.appendChild(i);
      }
      art.appendChild(g);
      if (a.readout) { // the decoded value next to the word, like the generic card
        var row = document.createElement("div"); row.className = "wordrow"; art.appendChild(row); row.appendChild(g);
        var ro = document.createElement("div"); ro.className = "ro"; ro.textContent = a.readout[0];
        var big = document.createElement("b"); big.textContent = a.readout[1]; ro.appendChild(big); row.appendChild(ro);
        document.querySelector(".site").classList.add("up");
      }
    }
    if (a.stats) {
      var st = document.createElement("div"); st.className = "stats";
      a.stats.forEach(function (x) { var dv = document.createElement("div"), bb = document.createElement("b"), sm = document.createElement("small"); bb.textContent = x[0]; if (x[2]) bb.className = x[2]; sm.textContent = x[1]; dv.append(bb, sm); st.appendChild(dv); });
      art.appendChild(st);
    }
    // largest title size (up to d.size) that keeps the whole card inside the frame
    var size = d.size || 112, pad = document.querySelector(".pad");
    h.style.fontSize = size + "px";
    var fits = function () { return pad.scrollHeight <= pad.clientHeight + 1 && h.scrollWidth <= h.clientWidth + 1; };
    while (!fits() && size > 48) { size -= 2; h.style.fontSize = size + "px"; }
    return size;
  };
</script>
</body></html>
