# Cloudflare Pages project config. The deployable site is the ./site folder;
# tools/, resume/ and verify/ next to it are build helpers and are never uploaded.
# ./functions (the guestbook and waitlist API) is picked up automatically on deploy.
name = "dillongreen"
pages_build_output_dir = "./site"
compatibility_date = "2026-10-01"

# Guestbook + studio waitlist. Schema: db/schema.sql (applied by hand, see README).
[[d1_databases]]
binding = "DB"
database_name = "dillongreen-db"
database_id = "b7df916d-a816-4c76-9bd7-87c51d55584d"

# ---------- Live status (functions/api/status.js) ----------
# Service bindings to the Workers-hosted projects. A Pages Function fetching another Worker on the
# same account's workers.dev subdomain can be refused (error 1042), so /api/status calls these
# Workers directly through bindings. Binding name = SVC_ + upper-cased service name ('-' -> '_').
# Node list: functions/_lib/projects-live.json (generated by tools/build_projects.py).
[[services]]
binding = "SVC_LITTLE_AIRFIELD"
service = "little-airfield"

[[services]]
binding = "SVC_DRAGONREALM"
service = "dragonrealm"

[[services]]
binding = "SVC_MIXTAPE_DRIFT"
service = "mixtape-drift"

[[services]]
binding = "SVC_CRUMB"
service = "crumb"

[[services]]
binding = "SVC_HALFSIES"
service = "halfsies"

[[services]]
binding = "SVC_BUTTER"
service = "butter"

[[services]]
binding = "SVC_BEEPBEACH"
service = "beepbeach"

# ---------- Email alerts (functions/_lib/notify.js) ----------
# The dg-notify Worker (workers/notify) sends the owner an email for each new guestbook signature
# and waitlist entry. Deploy it BEFORE this project. Secret on this project: NOTIFY_KEY (same value
# as the Worker's). Without NOTIFY_KEY the alerts are skipped silently.
[[services]]
binding = "NOTIFY"
service = "dg-notify"

# ---------- Admin (functions/api/admin, site/admin) ----------
# Locked behind Cloudflare Access. ACCESS_TEAM_DOMAIN is public (it is the login page host), so it lives
# in [vars] below. Secrets, never in this file: ACCESS_AUD and ADMIN_EMAILS (both required).
# Without either one every /api/admin request is a 403. The admin API only answers on dillongreen.dev
# and www.dillongreen.dev (functions/_lib/admin-core.js ADMIN_HOSTS); every other host gets a 404.
# Forms: the IP_SALT secret is required too; without it guestbook/waitlist posts are refused.
# DEV_ADMIN_BYPASS must NEVER be set here or as a Pages variable/secret (local testing only, via
# `wrangler pages dev ... --binding DEV_ADMIN_BYPASS=1`, and it only works on 127.0.0.1/localhost).

[[services]]
binding = "SVC_FERNWOOD"
service = "fernwood"

[vars]
ACCESS_TEAM_DOMAIN = "still-bird-a355.cloudflareaccess.com"
